syntax = "proto3";
package Lively.Grpc.Common.Proto.Desktop;
import "google/protobuf/empty.proto";

service DesktopService {
  rpc SetWallpaper (SetWallpaperRequest) returns (google.protobuf.Empty);
  rpc GetWallpapers (google.protobuf.Empty) returns (stream GetWallpapersResponse);
  rpc PreviewWallpaper (PreviewWallpaperRequest) returns (google.protobuf.Empty);
  rpc CloseAllWallpapers(CloseAllWallpapersRequest) returns (google.protobuf.Empty);
  rpc CloseWallpaperMonitor(CloseWallpaperMonitorRequest) returns (google.protobuf.Empty);
  rpc CloseWallpaperLibrary(CloseWallpaperLibraryRequest) returns (google.protobuf.Empty);
  rpc CloseWallpaperCategory(CloseWallpaperCategoryRequest) returns (google.protobuf.Empty);
  rpc SubscribeWallpaperChanged (google.protobuf.Empty) returns (stream google.protobuf.Empty);
  rpc SubscribeWallpaperError (google.protobuf.Empty) returns (stream WallpaperErrorResponse);
  rpc SubscribeUpdateWallpaper (google.protobuf.Empty) returns (stream UpdateWallpaperResponse) { option deprecated = true; }
  rpc SendMessageWallpaper(WallpaperMessageRequest) returns (google.protobuf.Empty);
  rpc GetCoreStats (google.protobuf.Empty) returns (GetCoreStatsResponse);
  rpc GetRoomSession (google.protobuf.Empty) returns (RoomSessionStatusResponse);
  rpc GetRoomReadGrants (RoomReadGrantsRequest) returns (RoomReadGrantsResponse);
  rpc SetRoomReadGrant (RoomSetReadGrantRequest) returns (RoomReadGrantsResponse);
  rpc TakeScreenshot(WallpaperScreenshotRequest) returns (google.protobuf.Empty);
  rpc EditWallpaper(EditWallpaperRequest) returns (EditWallpaperResponse);
  rpc CreateWallpaper(CreateWallpaperRequest) returns (CreateWallpaperResponse);
   rpc GetInstalledApps (google.protobuf.Empty) returns (stream AppInfo);
   rpc LaunchApp (LaunchAppRequest) returns (google.protobuf.Empty);
   rpc ResolveApp (ResolveAppRequest) returns (AppInfo);
   rpc GetSystemMedia (google.protobuf.Empty) returns (SystemMediaSnapshot);
   rpc ControlSystemMedia (SystemMediaControlRequest) returns (SystemMediaControlResponse);
   rpc GetSystemVolume (google.protobuf.Empty) returns (SystemVolumeSnapshot);
   rpc SetSystemVolume (SetSystemVolumeRequest) returns (SystemVolumeSnapshot);
 }

enum SystemMediaAction {
  unspecified = 0;
  play = 1;
  pause = 2;
  toggle_play_pause = 3;
  next = 4;
  previous = 5;
}

message SystemMediaControlRequest {
  SystemMediaAction action = 1;
}

message SystemMediaControlResponse {
  bool accepted = 1;
}

message SystemMediaSnapshot {
  bool has_session = 1;
  string source_app_id = 2;
  string title = 3;
  string artist = 4;
  string album_title = 5;
  string album_artist = 6;
  bytes thumbnail = 7;
  string thumbnail_content_type = 8;
  string playback_status = 9;
  int64 position_ms = 10;
  int64 duration_ms = 11;
  bool can_play = 12;
  bool can_pause = 13;
  bool can_toggle_play_pause = 14;
  bool can_next = 15;
  bool can_previous = 16;
}

message SystemVolumeSnapshot {
  double level = 1;
  bool muted = 2;
  string device_id = 3;
  string device_name = 4;
}

message SetSystemVolumeRequest {
  double level = 1;
  bool set_level = 2;
  bool muted = 3;
  bool set_muted = 4;
}

message AppInfo {
  string name = 1;
  string target = 2;
  string arguments = 3;
  string working_dir = 4;
  bytes icon_png = 5;
  string source = 6;
}

message LaunchAppRequest {
  string target = 1;
  string arguments = 2;
  string working_dir = 3;
}

message ResolveAppRequest {
  string path = 1;
}

message EditWallpaperRequest {
	string lively_info_path = 1;
}

message EditWallpaperResponse {
	bool is_success = 1;
	WallpaperErrorResponse error = 2;
}

message CreateWallpaperRequest {
	string file_path = 1;
	WallpaperCategory Category = 2;
	string arguments = 3;
}

message CreateWallpaperResponse {
	bool is_success = 1;
	string lively_info_path = 2;
	WallpaperErrorResponse error = 3;
}

message SetWallpaperRequest {
  string lively_info_path = 1;
  string monitor_id = 2;
  LibraryItemCategory type = 3 [deprecated = true];
}

message GetWallpapersResponse {
  string lively_info_path = 1;
  ScreenData screen = 2;
  string property_copy_path = 3;
  string thumbnail_path = 4;
  string preview_path = 5;
  WallpaperCategory category = 6;
}

message UpdateWallpaperResponse {
	UpdateWallpaperCategory type_ = 1;
	string lively_info_path_ = 2;
	string title = 3;
	string description = 4;
	string author = 5;
	string website = 6;
	string thumbnail_path_ = 7;
	string preview_path_ = 8;
	bool is_absolute_path = 9;
}

message GetCoreStatsResponse {
	string base_directory = 1;
	string assembly_version = 2;
	bool is_core_initialized = 3;
	string product_name = 4;
	string runtime_identity = 5;
	int32 process_id = 6;
	string app_data_directory = 7;
	string grpc_pipe_name = 8;
	// Set only after Core-owned confirmation of a current native exit action.
	bool is_product_exiting = 9;
}

message RoomSessionLifecycleStatus {
  string stage = 1;
  bool playback_paused = 2;
  bool locked = 3;
  int64 revision = 4;
}

message RoomSessionStatusResponse {
  bool active = 1;
  int32 protocol_version = 2;
  string room_id = 3;
  string session_id = 4;
  int64 revision = 5;
  string current_desk_id = 6;
  string target_desk_id = 7;
  string queued_desk_id = 8;
  string transition_id = 9;
  bool operable = 10;
  int32 player_pid = 11;
  string deadline_utc = 12;
  string installation_stamp = 13;
  RoomSessionLifecycleStatus lifecycle = 14;
}

message PreviewWallpaperRequest {
	string lively_info_path = 1;
}

message ScreenData {
  string device_id = 1;
  string device_name = 2;
  string display_name = 3;
  int32 h_monitor = 4;
  int32 index = 5;
  bool is_primary = 6;
  Rectangle bounds = 7;
  Rectangle working_area = 8;
}

message Rectangle {
	int32 x = 1;
	int32 y = 2;
	int32 width = 3;
	int32 height = 4;
	//int32 bottom = 1;
	//int32 left = 3;
	//int32 right = 4;
	//int32 top = 5;
}

message CloseAllWallpapersRequest {
	bool terminate = 1 [deprecated = true];
}

message CloseWallpaperMonitorRequest {
	bool terminate = 1 [deprecated = true];
    string monitor_id = 2;
}

message CloseWallpaperLibraryRequest {
	bool terminate = 1 [deprecated = true];
	string lively_info_path = 2;
}

message CloseWallpaperCategoryRequest {
	bool terminate = 1 [deprecated = true];
	WallpaperCategory Category = 2;
}

message WallpaperMessageRequest {
	string monitor_id = 1;
	string lively_info_path = 2;
	string msg = 3;
}

message WallpaperScreenshotRequest {
	string monitor_id = 1;
	string save_path = 2;
}

message WallpaperErrorResponse {
	ErrorCategory error = 1;
	string error_msg = 2;
}

enum ErrorCategory {
	workerw = 0;
	wallpaper_not_found = 1;
	wallpaper_plugin_fail = 2;
	wallpaper_plugin_not_found = 3;
	wallpaper_plugin_media_codec_missing = 4;
	wallpaper_not_allowed = 5;
	screen_not_found = 6;
	general = 7;
	wallpaper_webview2_not_found = 8;
	wallpaper_file_error = 9;
}

enum WallpaperCategory {
	app = 0;
	web = 1;
	webaudio = 2;
	url = 3;
	bizhawk = 4;
	unity = 5;
	godot = 6;
	video = 7;
	gif = 8;
	unityaudio = 9;
	videostream = 10;
	picture = 11;
}

enum LibraryItemCategory {
	processing = 0;
	ready = 1;
	cmdImport = 2;
	multiImport = 3;
	edit = 4;
}

enum UpdateWallpaperCategory {
	changed = 0;
	remove = 1;
    done = 2;
}

// Configurator-only metadata; no private targets or mutable author interface.
message RoomReadGrantsRequest {
  string room_id = 1;
  string installation_stamp = 2;
}
message RoomSetReadGrantRequest {
  string room_id = 1;
  string installation_stamp = 2;
  string consumer_id = 3;
  repeated string capabilities = 4;
  bool allow = 5;
}
message RoomReadGrantCapabilityStatus {
  string capability = 1;
  bool allowed = 2;
}
message RoomReadGrantConsumerStatus {
  string consumer_id = 1;
  repeated RoomReadGrantCapabilityStatus capabilities = 2;
}
message RoomReadGrantsResponse {
  string status = 1;
  string room_id = 2;
  string installation_stamp = 3;
  repeated RoomReadGrantConsumerStatus consumers = 4;
}
