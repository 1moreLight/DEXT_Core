<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dext Room Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="desk">
  <div id="desk-background"></div>

  <div id="icon-layer"></div>

  <div id="dock">
    <button id="prev-desk" class="dock-btn" title="上一个 Desk">‹</button>
    <span id="desk-indicator"></span>
    <button id="next-desk" class="dock-btn" title="下一个 Desk">›</button>
    <button id="edit-done" class="dock-btn" title="完成编辑">✓</button>
  </div>
</div>

<div id="transition">
  <div id="transition-text"></div>
</div>

<div id="toast"></div>

<script src="main.js"></script>
</body>
</html>
