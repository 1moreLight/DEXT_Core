<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dext Room</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="desk">
  <div id="desk-viewport">
    <div id="desk-main">
      <video class="desk-video" autoplay muted loop playsinline></video>
      <div class="desk-bg"></div>
      <div class="widget-layer" aria-label="Desk widgets"></div>
      <div class="icon-layer"><div id="reorder-placeholder" data-active="false"></div></div>
    </div>
    <div id="desk-staging"></div>
  </div>

  <div id="dock">
    <div class="dock-inner">
      <div id="dock-apps"></div>
      <div class="dock-sep"></div>
      <button id="prev-desk" class="dock-btn" title="上一个 Desk">‹</button>
      <span id="desk-indicator"></span>
      <button id="next-desk" class="dock-btn" title="下一个 Desk">›</button>
      <button id="edit-done" class="dock-btn" title="完成编辑">✓</button>
    </div>
  </div>
</div>

<div id="transition-video-wrap">
  <video id="transition-video" muted playsinline></video>
</div>

<div id="transition">
  <div id="transition-text"></div>
</div>

<div id="toast"></div>

<script src="capability-bridge.js"></script>
<script src="layout.js"></script>
<script src="layout-motion.js"></script>
<script src="desktop-layout-controller.js"></script>
<script src="main.js"></script>
</body>
</html>
