<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f}
    body{background:radial-gradient(circle at 50% 45%,#1d4ed8 0,#0f172a 35%,#020617 75%)}
    body::before{content:"";position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,transparent 0 11deg,rgba(56,189,248,.08) 12deg 13deg);animation:spin 24s linear infinite}
    @keyframes spin{to{transform:rotate(1turn)}}
  </style>
</head>
<body></body>
</html>
