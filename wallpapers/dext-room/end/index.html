<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center;
         font-family: Consolas, monospace; color: rgba(215, 222, 230, 0.85); }
  #box { position: relative; width: min(52vmin, 480px); text-align: center; }
  #hex { width: 30vmin; height: 30vmin; max-width: 260px; max-height: 260px;
         margin: 0 auto 24px; transition: transform 1.6s cubic-bezier(.6,0,.8,.4), opacity 1.8s ease; }
  #hex.off { transform: scale(0.5) rotate(40deg); opacity: 0; }
  #hex polygon { fill: none; stroke: rgba(255, 120, 90, 0.85); stroke-width: 1.5; }
  #hex circle { fill: rgba(255, 120, 90, 0.85); }
  #lines { font-size: 13px; letter-spacing: .18em; text-align: left;
           min-height: 6em; white-space: pre-line; }
  .scan { position: fixed; left: 0; right: 0; height: 1px;
          background: rgba(255, 120, 90, 0.3); animation: scan 1.2s linear infinite; }
  @keyframes scan { from { top: -2px; } to { top: 100%; } }
</style>
</head>
<body>
  <div class="scan"></div>
  <div id="box">
    <svg id="hex" viewBox="0 0 100 100">
      <polygon points="50,4 92,27 92,73 50,96 8,73 8,27"/>
      <polygon points="50,22 76,37 76,63 50,78 24,63 24,37"/>
      <circle cx="50" cy="50" r="4"/>
    </svg>
    <div id="lines"></div>
  </div>
<script>
  // end slot: play the shutdown sequence, then ack to the renderer.
  const LINES = [
    "SENSOR ARRAY .......... OFFLINE",
    "ARMOR LATTICE .......... RELEASED",
    "REACTOR OUTPUT ......... STANDBY",
    "DEXTEROUS SYSTEM ...... GOODBYE"
  ];
  const el = document.getElementById("lines");
  let i = 0;
  const step = () => {
    if (i < LINES.length) {
      el.textContent += LINES[i] + "\n";
      i++;
      setTimeout(step, 450);
    } else {
      document.getElementById("hex").classList.add("off");
      const instanceId = new URLSearchParams(location.search).get("dextInstanceId");
      parent.postMessage({ type: "dext:scene", event: "ready", instanceId }, "*");
      setTimeout(() => parent.postMessage(
        { type: "dext:scene", event: "done", instanceId }, "*"
      ), 1400);
    }
  };
  setTimeout(step, 300);
</script>
</body>
</html>
