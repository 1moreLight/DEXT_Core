<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12091d;color:#f5d0fe;font-family:"Segoe UI",sans-serif}
    body{display:grid;place-items:center}
    div{font-size:clamp(32px,6vw,88px);letter-spacing:.18em;animation:pulse .7s ease both}
    @keyframes pulse{from{opacity:0;transform:scale(.86)}50%{opacity:1}to{opacity:0;transform:scale(1.08)}}
  </style>
</head>
<body>
  <div>返回主页</div>
  <script>
    const instanceId = new URLSearchParams(location.search).get("dextInstanceId");
    parent.postMessage({ type: "dext:scene", event: "ready", instanceId }, "*");
    setTimeout(() => parent.postMessage(
      { type: "dext:scene", event: "done", instanceId }, "*"
    ), 700);
  </script>
</body>
</html>
