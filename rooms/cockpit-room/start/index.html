<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center;
         font-family: Consolas, monospace; color: rgba(215, 222, 230, 0.9); }
  #box { position: relative; width: min(52vmin, 480px); text-align: center; }
  #hex { width: 34vmin; height: 34vmin; max-width: 300px; max-height: 300px;
         margin: 0 auto 24px; opacity: 0; transform: scale(0.6) rotate(-30deg);
         transition: opacity .5s ease, transform .7s cubic-bezier(.2,.8,.2,1); }
  #hex.on { opacity: 1; transform: scale(1) rotate(0deg); }
  #hex polygon { fill: none; stroke: rgba(215, 222, 230, 0.85); stroke-width: 1.5; }
  #hex .inner { stroke: rgba(255, 196, 84, 0.9); stroke-dasharray: 600;
                stroke-dashoffset: 600; animation: draw 1.4s .4s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  #lines { font-size: 13px; letter-spacing: .18em; text-align: left;
           min-height: 5.2em; white-space: pre-line; }
  #bar { height: 2px; background: rgba(215, 222, 230, 0.15); margin-top: 18px; }
  #bar > div { height: 100%; width: 0%; background: rgba(255, 196, 84, 0.9);
               transition: width .3s linear; }
  .scan { position: fixed; left: 0; right: 0; height: 1px;
          background: rgba(215, 222, 230, 0.25); animation: scan 1.6s linear infinite; }
  @keyframes scan { from { top: -2px; } to { top: 100%; } }
</style>
</head>
<body>
  <div class="scan"></div>
  <div id="box">
    <svg id="hex" viewBox="0 0 100 100">
      <polygon points="50,4 92,27 92,73 50,96 8,73 8,27"/>
      <polygon class="inner" points="50,22 76,37 76,63 50,78 24,63 24,37"/>
      <circle cx="50" cy="50" r="4" fill="rgba(255,196,84,0.9)"/>
    </svg>
    <div id="lines"></div>
    <div id="bar"><div id="fill"></div></div>
  </div>
<script>
  // room-author perspective: play the boot sequence, then tell the renderer we're done.
  const LINES = [
    "REACTOR OUTPUT ......... NOMINAL",
    "ARMOR LATTICE .......... SEALED",
    "SENSOR ARRAY ........... ONLINE",
    "DEXTEROUS SYSTEM ....... READY"
  ];
  const el = document.getElementById("lines");
  const fill = document.getElementById("fill");
  document.getElementById("hex").classList.add("on");

  let i = 0;
  const step = () => {
    if (i < LINES.length) {
      el.textContent += LINES[i] + "\n";
      fill.style.width = `${((i + 1) / LINES.length) * 100}%`;
      i++;
      setTimeout(step, 420);
    } else {
      setTimeout(() => parent.postMessage("dext:slotDone", "*"), 500);
    }
  };
  setTimeout(step, 600);
</script>
</body>
</html>
